[project]
name = "format-sensitivity-reranking"
version = "1.0.0"
description = "Evaluating and mitigating format sensitivity in metadata-enriched cross-encoder reranking"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "datasets>=2.19.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "einops>=0.8.2",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
notebooks = ["ipykernel>=7.3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9", "pre-commit>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsr"]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/fsr"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP 8)
    "W",   # pycodestyle warnings (PEP 8)
    "D",   # pydocstyle (PEP 257)
    "F",   # pyflakes
    "I",   # import ordering
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = ["D100", "D101", "D102", "D103"]
